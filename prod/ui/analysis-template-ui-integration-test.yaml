apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  # Ensure a short name is used
  # See https://github.com/argoproj/argo-rollouts/issues/795
  name: jettison-ui-e2e-test
  namespace: jettisonproj
  labels:
    app.kubernetes.io/version: 72c9a0d2b9557c519ecd2e8d4b7a4ed2cce6c108
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: jettison-ui-e2e-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: jettison-ui-e2e-test
                app.kubernetes.io/version: 72c9a0d2b9557c519ecd2e8d4b7a4ed2cce6c108
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: jettison-ui-e2e-test
                image: ghcr.io/jettisonproj/jettison-ui-integration-test:72c9a0d2b9557c519ecd2e8d4b7a4ed2cce6c108
                env:
                - name: PLAYWRIGHT_BASE_URL
                  value: "http://{{args.service-name}}"
                - name: CI
                  value: "true"
              restartPolicy: Never
