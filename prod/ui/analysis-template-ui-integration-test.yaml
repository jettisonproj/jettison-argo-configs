apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  # Ensure a short name is used
  # See https://github.com/argoproj/argo-rollouts/issues/795
  name: jettison-ui-e2e-test
  namespace: jettisonproj
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: jettison-ui-e2e-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: jettison-ui-e2e-test
                app.kubernetes.io/version: 1b70a29a042ee7b110b3caeff54181992a273a90
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: jettison-ui-e2e-test
                image: ghcr.io/jettisonproj/jettison-ui-integration-test:1b70a29a042ee7b110b3caeff54181992a273a90
                env:
                - name: PLAYWRIGHT_BASE_URL
                  value: "http://{{args.service-name}}"
                - name: CI
                  value: "true"
              restartPolicy: Never
