apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: jettison-api-e2e-test
  namespace: jettisonproj
  labels:
    app.kubernetes.io/version: 855e39541649547684279264407f0020bdea60bb
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: jettison-api-e2e-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: jettison-api-e2e-test
                app.kubernetes.io/version: 855e39541649547684279264407f0020bdea60bb
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              serviceAccountName: jettison-api-e2e-sa
              containers:
              - name: jettison-api-e2e-test
                image: ghcr.io/jettisonproj/jettison-controller-integration-test:855e39541649547684279264407f0020bdea60bb
                # todo need to target the specified service name
                # env:
                # - name: JETTISON_API_TEST_HOST
                #   value: "{{args.service-name}}"
              restartPolicy: Never
